<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bob Voice Studio (PTT + Whisper)</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 24px; max-width: 860px; }
    .card { border: 1px solid #e8e8e8; border-radius: 14px; padding: 14px; margin: 14px 0; }
    .muted { color: #666; font-size: 14px; }
    textarea { width: 100%; min-height: 130px; padding: 10px; border-radius: 10px; border: 1px solid #ccc; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid #ccc; cursor: pointer; }
    #ptt { width: 100%; padding: 18px; border-radius: 14px; font-size: 18px; font-weight: 700; background: #111; color: #fff; border: none; }
    #ptt.recording { background: #b00020; }
  </style>
</head>
<body>
  <h1>🎙️ Bob Voice Studio — One Button Talk</h1>
  <p class="muted">Click once to start speaking, click again to stop. Transcription runs locally via Whisper.</p>

  <div class="card">
    <button id="ptt">Start Talking</button>
    <div class="row" style="margin-top:10px;">
      <span id="state" class="muted">Idle</span>
      <span id="autoHint" class="muted"></span>
    </div>
  </div>

  <div class="card">
    <h3>Transcript</h3>
    <textarea id="transcript" placeholder="Transcript appears here..."></textarea>
    <div class="row" style="margin-top:10px;">
      <button id="copyBtn">Copy Transcript</button>
      <button id="clearBtn">Clear</button>
      <button id="downloadAudioBtn" disabled>Download Last Audio</button>
    </div>
  </div>

  <div class="card">
    <h3>Hear Bob</h3>
    <textarea id="reply" placeholder="Paste Bob's response and press Speak"></textarea>
    <div class="row" style="margin-top:10px;">
      <button id="speakBtn">Speak</button>
      <button id="stopSpeakBtn">Stop</button>
      <label class="muted">Rate <input id="rate" type="range" min="0.7" max="1.3" value="1" step="0.05"></label>
    </div>
  </div>

<script>
  const ptt = document.getElementById('ptt');
  const state = document.getElementById('state');
  const transcript = document.getElementById('transcript');
  const autoHint = document.getElementById('autoHint');
  const downloadAudioBtn = document.getElementById('downloadAudioBtn');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');
  const reply = document.getElementById('reply');
  const speakBtn = document.getElementById('speakBtn');
  const stopSpeakBtn = document.getElementById('stopSpeakBtn');
  const rate = document.getElementById('rate');

  let mediaRecorder = null;
  let chunks = [];
  let audioBlob = null;
  let isRecording = false;

  async function startPTT() {
    if (isRecording) return;
    isRecording = true;
    ptt.classList.add('recording');
    ptt.textContent = 'Stop Talking';
    state.textContent = 'Listening...';
    autoHint.textContent = '';

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    chunks = [];
    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) chunks.push(e.data);
    };
    mediaRecorder.onstop = async () => {
      if (!chunks.length) {
        state.textContent = 'No audio captured. Try again and keep holding while speaking.';
        return;
      }
      audioBlob = new Blob(chunks, { type: 'audio/webm' });
      downloadAudioBtn.disabled = false;
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      await transcribeBlob(audioBlob);
    };
    mediaRecorder.start(250); // timeslice helps some browsers flush chunks reliably
  }

  async function stopPTT() {
    if (!isRecording) return;
    isRecording = false;
    ptt.classList.remove('recording');
    ptt.textContent = 'Start Talking';
    state.textContent = 'Processing...';

    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      try { mediaRecorder.requestData(); } catch {}
      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      }, 120);

      // watchdog in case onstop never fires in this browser/session
      setTimeout(async () => {
        if (state.textContent === 'Processing...') {
          if (chunks.length) {
            audioBlob = new Blob(chunks, { type: 'audio/webm' });
            await transcribeBlob(audioBlob);
          } else {
            state.textContent = 'No audio chunks received. Try click-to-start, click-to-stop.';
          }
        }
      }, 1800);
    } else {
      state.textContent = 'Recorder not active. Tap and hold, then speak.';
    }
  }

  async function transcribeBlob(blob) {
    try {
      const fd = new FormData();
      fd.append('audio', blob, `clip-${Date.now()}.webm`);
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);
      const res = await fetch('/transcribe', { method: 'POST', body: fd, signal: controller.signal });
      clearTimeout(timeout);
      const raw = await res.text();
      let data = null;
      try { data = JSON.parse(raw); } catch {
        state.textContent = `Transcribe failed: non-JSON response (status ${res.status})`;
        autoHint.textContent = raw.slice(0, 120);
        return;
      }
      if (!data.ok) {
        state.textContent = `Transcribe failed: ${data.error || 'unknown'}`;
        if (data.whisper_bin) autoHint.textContent = `whisper path: ${data.whisper_bin}`;
        return;
      }
      transcript.value = [transcript.value.trim(), (data.text || '').trim()].filter(Boolean).join(' ');
      state.textContent = 'Captured + transcribed.';
      if (transcript.value.trim()) {
        try {
          await navigator.clipboard.writeText(transcript.value.trim());
          autoHint.textContent = 'Transcript copied. Paste into Bob chat and send.';
        } catch {
          autoHint.textContent = 'Transcript ready.';
        }
      }
    } catch (e) {
      if (e.name === 'AbortError') state.textContent = 'Transcribe timed out (45s). Try a shorter clip.';
      else state.textContent = `Transcribe failed: ${e.message}`;
    }
  }

  // Primary control: single-button toggle (click once to start, click again to stop)
  ptt.addEventListener('click', () => {
    if (isRecording) stopPTT();
    else startPTT();
  });

  copyBtn.onclick = async () => {
    await navigator.clipboard.writeText(transcript.value || '');
    autoHint.textContent = 'Copied.';
  };
  clearBtn.onclick = () => { transcript.value = ''; autoHint.textContent = ''; };

  downloadAudioBtn.onclick = () => {
    if (!audioBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(audioBlob);
    a.download = `bob-ptt-${Date.now()}.webm`;
    a.click();
  };

  speakBtn.onclick = () => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(reply.value || '');
    u.rate = Number(rate.value);
    speechSynthesis.speak(u);
  };
  stopSpeakBtn.onclick = () => speechSynthesis.cancel();
</script>
</body>
</html>
